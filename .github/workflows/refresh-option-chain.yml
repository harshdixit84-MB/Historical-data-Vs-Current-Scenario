name: Refresh Option Chain (Intraday)

on:
  workflow_dispatch: {}
  schedule:
    # Every 30 minutes, roughly covering NSE market hours (9:15am-3:30pm IST)
    # with some buffer either side. IST = UTC+5:30, so 9:15am-3:30pm IST is
    # 3:45am-10:00am UTC.
    - cron: "*/30 3-10 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch option chain
        run: python scripts/fetch_option_chain.py
        continue-on-error: true

      - name: Generate trade signal
        run: python scripts/generate_signal.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/option_chain.json data/trade_signal.json
          git diff --cached --quiet || git commit -m "Intraday option chain + signal refresh [automated]"
          git pull --rebase origin main || true
          git push
