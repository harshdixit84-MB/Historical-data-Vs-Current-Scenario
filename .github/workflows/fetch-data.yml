name: Fetch Nifty & Sector Data

on:
  workflow_dispatch: {}
  schedule:
    # 11:00 UTC = 4:30 PM IST, after market close, Mon-Fri
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python scripts/fetch_nifty_data.py

      - name: Recompute cycle analysis
        run: |
          python scripts/detect_cycles.py
          python scripts/sector_leadership.py
          python scripts/cycle_comparator.py
          python scripts/reversal_projection.py
          python scripts/export_price_series.py

      - name: Fetch option chain
        run: python scripts/fetch_option_chain.py
        continue-on-error: true  # option chain depends on an external broker session; don't fail the whole daily run if it's temporarily down

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Nifty data & cycle analysis [automated]"
          git push
